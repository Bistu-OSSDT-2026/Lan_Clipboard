<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lan Clipboard</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #313244;
    --overlay: #45475a;
    --text: #cdd6f4;
    --subtext: #a6adc8;
    --muted: #6c7086;
    --accent: #cba6f7;
    --accent-hover: #b4befe;
    --green: #a6e3a1;
    --red: #f38ba8;
    --yellow: #f9e2af;
    --blue: #89b4fa;
    --radius: 8px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── 标题栏 ── */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--overlay);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }

  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    -webkit-app-region: no-drag;
  }

  .titlebar-left .logo { font-size: 20px; }
  .titlebar-left h1 { font-size: 15px; font-weight: 600; color: var(--accent); }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.connecting { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .status-dot.disconnected { background: var(--muted); }

  .status-indicator.connected { background: rgba(166,227,161,0.12); color: var(--green); }
  .status-indicator.connecting { background: rgba(249,226,175,0.12); color: var(--yellow); }
  .status-indicator.disconnected { background: rgba(108,112,134,0.12); color: var(--muted); }

  .titlebar-right {
    display: flex;
    gap: 6px;
    -webkit-app-region: no-drag;
  }

  .btn-icon {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--subtext);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }

  .btn-icon:hover { background: var(--overlay); color: var(--text); }

  /* ── 主内容区 ── */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 16px;
    gap: 12px;
  }

  /* ── 连接设置栏 ── */
  .connect-panel {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    flex-shrink: 0;
  }

  .connect-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .connect-row input {
    padding: 8px 12px;
    border: 1px solid var(--overlay);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .connect-row input:focus { border-color: var(--accent); }
  .connect-row input::placeholder { color: var(--muted); }
  .connect-row .ip-input { flex: 1; min-width: 160px; }
  .connect-row .room-input { width: 130px; }
  .connect-row .sep { color: var(--muted); font-size: 13px; }

  .btn {
    padding: 8px 18px;
    border: none; border-radius: 6px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--red); color: var(--bg); }
  .btn-danger:hover { opacity: 0.85; }
  .btn-ghost {
    background: transparent;
    color: var(--subtext);
    border: 1px solid var(--overlay);
    padding: 5px 12px;
    font-size: 12px;
  }
  .btn-ghost:hover { background: var(--overlay); color: var(--text); }

  .server-info {
    font-size: 12px;
    color: var(--green);
    margin-top: 8px;
    word-break: break-all;
    display: none;
  }
  .server-info.show { display: block; }

  .server-info.server-info-disconnected {
    color: var(--muted);
    display: block;
  }

  .auto-sync-hint {
    font-size: 12px;
    color: var(--accent);
    margin-top: 6px;
    padding: 4px 0;
  }

  /* ── 历史列表 ── */
  .history-panel {
    background: var(--surface);
    border-radius: var(--radius);
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--overlay);
    flex-shrink: 0;
  }

  .history-header h2 {
    font-size: 14px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .history-header .count {
    font-size: 11px;
    color: var(--muted);
    font-weight: normal;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .history-list::-webkit-scrollbar { width: 5px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--overlay); border-radius: 3px; }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(69,71,90,0.3);
    transition: background 0.1s;
    cursor: default;
  }

  .history-item:hover { background: rgba(203,166,247,0.05); }

  .item-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .item-tag.local { background: rgba(137,180,250,0.15); color: var(--blue); }
  .item-tag.remote { background: rgba(166,227,161,0.15); color: var(--green); }

  .item-time {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 52px;
  }

  .item-content {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-copy {
    padding: 3px 10px;
    font-size: 11px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .history-item:hover .item-copy { opacity: 1; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    padding: 30px;
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
  .empty-state p { font-size: 13px; }

  /* ── 发送栏 ── */
  .send-panel {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    align-items: flex-end;
  }

  .send-panel textarea {
    flex: 1;
    min-height: 38px;
    max-height: 100px;
    padding: 9px 12px;
    border: 1px solid var(--overlay);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    resize: none;
    transition: border-color 0.2s;
  }

  .send-panel textarea:focus { border-color: var(--accent); }
  .send-panel textarea::placeholder { color: var(--muted); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--bg);
    padding: 6px 18px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    animation: toastIn 0.3s, toastOut 0.3s 1.2s forwards;
    z-index: 999;
    pointer-events: none;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes toastOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
</style>
</head>
<body>

  <!-- ═══ 标题栏 ═══ -->
  <div class="titlebar">
    <div class="titlebar-left">
      <span class="logo">📋</span>
      <h1>Lan Clipboard</h1>
      <span id="statusBadge" class="status-indicator disconnected">
        <span class="status-dot disconnected"></span>
        <span id="statusLabel">未连接</span>
      </span>
    </div>
    <div class="titlebar-right">
      <button class="btn-icon" id="btnMinimize" title="最小化到托盘">─</button>
      <button class="btn-icon" id="btnClose" title="最小化到托盘">✕</button>
    </div>
  </div>

  <!-- ═══ 主内容区 ═══ -->
  <div class="main-content">

    <!-- 连接设置 -->
    <div class="connect-panel">
      <div class="connect-row">
        <input class="ip-input" id="inputServer" type="text" placeholder="服务器 IP">
        <span class="sep">:3000 /</span>
        <input class="room-input" id="inputRoom" type="text" placeholder="房间名" value="office">
        <button class="btn btn-primary" id="btnConnect">连接</button>
        <button class="btn btn-danger" id="btnDisconnect" style="display:none">断开</button>
      </div>
      <div class="server-info server-info-disconnected" id="serverInfo">未连接</div>
      <div class="auto-sync-hint" id="autoSyncHint" style="display:none">
        🔄 自动同步中 — Ctrl+C 复制即自动发送，无需手动操作
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="history-panel">
      <div class="history-header">
        <h2>📋 剪贴板历史 <span class="count" id="historyCount">(0)</span></h2>
        <button class="btn btn-ghost" id="btnClearHistory">清空</button>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">
          <div class="icon">📭</div>
          <p>连接服务器后，复制的内容会出现在这里</p>
        </div>
      </div>
    </div>

    <!-- 发送栏 -->
    <div class="send-panel">
      <textarea id="inputSend" placeholder="输入文本，Enter 发送…" rows="1"></textarea>
      <button class="btn btn-primary" id="btnSend">发送</button>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
